function $(id){

function shuffle(arr){
  const a = [...arr];

  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function lessonOf(number){
  if(number <= 750){
    return Math.ceil(number / 50);
  }

  return 16;
}

function lessonName(number){
  const lesson = lessonOf(number);

  if(lesson === 16){
    return "Bổ sung";
  }

  return `Bài ${lesson}`;
}

function initAudio(){

  if(audioCtx){
    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

    return;
  }

  try{
    audioCtx = new (window.AudioContext ||
                    window.webkitAudioContext)();

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

  }catch(e){
    console.log("Không thể khởi tạo âm thanh:", e);
  }
}


/* ---------- Âm thanh đúng ---------- */

function correctSound(){

  if(muted || !audioCtx) return;

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";

  osc.frequency.setValueAtTime(620, now);
  osc.frequency.exponentialRampToValueAtTime(
    920,
    now + 0.13
  );

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    0.16,
    now + 0.015
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.22
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.23);
}


/* ---------- Âm thanh sai ---------- */

function wrongSound(){

  if(muted || !audioCtx) return;

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "triangle";

  osc.frequency.setValueAtTime(240, now);
  osc.frequency.exponentialRampToValueAtTime(
    145,
    now + 0.18
  );

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    0.13,
    now + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.22
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.23);
}


/* ---------- Âm thanh hoàn thành ---------- */

function finishSound(){

  if(muted || !audioCtx) return;

  const notes = [
    523.25,
    659.25,
    783.99,
    1046.50
  ];

  notes.forEach((freq, i) => {

    const now =
      audioCtx.currentTime + i * 0.13;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      now + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.30
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.31);
  });
}


/* =========================
   NHẠC NỀN
   ========================= */

const melody = [
  261.63,
  329.63,
  392.00,
  329.63,
  293.66,
  349.23,
  440.00,
  349.23
];

function playMusicNote(){

  if(!audioCtx || muted || !musicOn) return;

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";

  const freq =
    melody[musicStep % melody.length];

  osc.frequency.setValueAtTime(
    freq,
    now
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.025,
    now + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.42
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.44);

  musicStep++;
}


function startMusic(){

  initAudio();

  stopMusic();

  if(!musicOn || muted || !audioCtx){
    return;
  }

  playMusicNote();

  musicTimer = setInterval(() => {

    if(!muted && musicOn){
      playMusicNote();
    }

  }, 480);
}


function stopMusic(){

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer = null;
  }

  musicStep = 0;
}


/* =========================
   NHẠC CHÚC MỪNG
   ========================= */

function startCelebrationMusic(){

  stopCelebrationMusic();

  if(muted || !audioCtx) return;

  const notes = [
    523.25,
    659.25,
    783.99,
    1046.50,
    783.99,
    1046.50
  ];

  let index = 0;

  celebrationTimer = setInterval(() => {

    if(muted){
      return;
    }

    const freq = notes[index % notes.length];
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.13,
      now + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.35
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.36);

    index++;

  }, 360);
}


function stopCelebrationMusic(){

  if(celebrationTimer){
    clearInterval(celebrationTimer);
    celebrationTimer = null;
  }
}

/* =========================
   TẠO PHÂN LOẠI BÀI
   ========================= */

function getLessonPool(){

  if(selectedLesson === "all"){
    return [...VOCAB];
  }

  const lessonNumber =
    Number(selectedLesson);

  return VOCAB.filter(
    word => lessonOf(word.n) === lessonNumber
  );
}


/* =========================
   TẠO DANH SÁCH CÂU HỎI
   ========================= */

function createQuestionPool(){

  pool = getLessonPool();

  if(pool.length === 0){
    alert("Không có từ vựng trong bài này.");
    return false;
  }

  const shuffled =
    shuffle(pool);

  let amount;

  if(selectedCount === "all"){
    amount = shuffled.length;
  }else{
    amount = Number(selectedCount);

    if(amount > shuffled.length){
      amount = shuffled.length;
    }
  }

  questions =
    shuffled.slice(0, amount);

  return questions.length > 0;
}


/* =========================
   TẠO ĐÁP ÁN NHIỄU
   ========================= */

function getDistractors(correct, field, amount = 3){

  const candidates =
    shuffle(
      pool.filter(word =>
        word.n !== correct.n &&
        word[field] !== correct[field]
      )
    );

  const result = [];

  for(const word of candidates){

    if(!result.includes(word[field])){
      result.push(word[field]);
    }

    if(result.length >= amount){
      break;
    }
  }

  return result;
}

function getBestScore(){

  try{
    return Number(
      localStorage.getItem(
        "bacchi_best_score"
      ) || 0
    );

  }catch(e){
    return 0;
  }
}


function saveBestScore(value){

  try{

    const old =
      getBestScore();

    if(value > old){

      localStorage.setItem(
        "bacchi_best_score",
        String(value)
      );

      return true;
    }

  }catch(e){}

  return false;
}

/* =========================
   CHỌN LOẠI CÂU HỎI
   ========================= */

function getQuestionType(){

  if(currentMode === "zhvi"){
    return "zhvi";
  }

  if(currentMode === "vizh"){
    return "vizh";
  }

  if(currentMode === "zhpy"){
    return "zhpy";
  }

  /* mixed */

  const types = [
    "zhvi",
    "vizh",
    "zhpy"
  ];

  return types[
    Math.floor(
      Math.random() * types.length
    )
  ];
}


/* =========================
   TẠO CÂU HỎI
   ========================= */

function buildQuestion(word){

  const type =
    getQuestionType();

  let question = "";
  let correct = "";
  let field = "vi";

  if(type === "zhvi"){

    question =
      `<div class="q-label">
        Dịch từ này sang tiếng Việt
       </div>
       <div class="q-main zh">
        ${word.zh}
       </div>
       <div class="q-sub">
        ${word.py}
       </div>`;

    correct = word.vi;
    field = "vi";
  }


  else if(type === "vizh"){

    question =
      `<div class="q-label">
        Chọn chữ Hán phồn thể
       </div>
       <div class="q-main">
        ${word.vi}
       </div>
       <div class="q-sub">
        Tiếng Trung
       </div>`;

    correct = word.zh;
    field = "zh";
  }


  else if(type === "zhpy"){

    question =
      `<div class="q-label">
        Chọn Pinyin đúng
       </div>
       <div class="q-main zh">
        ${word.zh}
       </div>
       <div class="q-sub">
        Chọn cách đọc
       </div>`;

    correct = word.py;
    field = "py";
  }


  return {
    type,
    question,
    correct,
    field
  };
}


/* =========================
   HIỂN THỊ CÂU HIỆN TẠI
   ========================= */

function renderQuestion(){

  if(
    !questions.length ||
    currentIndex >= questions.length
  ){
    finishGame();
    return;
  }

  answered = false;

  const word =
    questions[currentIndex];

  const data =
    buildQuestion(word);

  updateProgress();
  updateStats();


  /* ---------- câu hỏi ---------- */

  if($("question")){
    $("question").innerHTML =
      data.question;
  }


  /* ---------- phản hồi ---------- */

  if($("feedback")){
    $("feedback").textContent = "";
    $("feedback").className =
      "feedback";
  }


  /* ---------- đáp án ---------- */

  const answers =
    $("answers");

  if(!answers){
    return;
  }

  answers.innerHTML = "";


  let options = [
    data.correct,
    ...getDistractors(
      word,
      data.field,
      3
    )
  ];

  options =
    shuffle(options);


  options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.className =
      "answer-btn";

    button.type = "button";

    button.dataset.value =
      option;

    button.innerHTML =
      `<span class="answer-letter">
        ${String.fromCharCode(65 + index)}
       </span>
       <span class="answer-text">
        ${option}
       </span>`;


    button.addEventListener(
      "click",
      () => answerQuestion(
        option,
        data.correct,
        word,
        button
      )
    );


    answers.appendChild(button);
  });
}


/* =========================
   TRẢ LỜI
   ========================= */

function answerQuestion(
  selected,
  correct,
  word,
  clickedButton
){

  if(answered){
    return;
  }


  /* ---------- SAI ---------- */

  if(selected !== correct){

    wrongSound();

    streak = 0;

    if(
      !wrongWords.some(
        item => item.n === word.n
      )
    ){
      wrongWords.push(word);
    }


    if(clickedButton){
      clickedButton.classList.add(
        "wrong"
      );
    }


    if($("feedback")){

      $("feedback").textContent =
        "❌ Chưa đúng, thử lại nhé!";

      $("feedback").className =
        "feedback wrong-text";
    }


    updateStats();

    return;
  }


  /* ---------- ĐÚNG ---------- */

  answered = true;

  correctSound();

  score++;

  streak++;

  if(streak > bestStreak){
    bestStreak = streak;
  }


  if(clickedButton){
    clickedButton.classList.add(
      "correct"
    );
  }


  /* Khoá tất cả nút */

  document
    .querySelectorAll(".answer-btn")
    .forEach(btn => {
      btn.disabled = true;

      if(
        btn.dataset.value === correct
      ){
        btn.classList.add(
          "correct"
        );
      }
    });


  if($("feedback")){

    $("feedback").textContent =
      "🎉 Chính xác!";

    $("feedback").className =
      "feedback correct-text";
  }


  updateStats();


  /* ---------- câu cuối ---------- */

  if(
    currentIndex >=
    questions.length - 1
  ){

    setTimeout(() => {
      finishGame();
    }, 550);

    return;
  }


  /* ---------- tự chuyển câu ---------- */

  setTimeout(() => {

    currentIndex++;

    renderQuestion();

  }, 550);
}


/* =========================
   BẮT ĐẦU GAME
   ========================= */

function startGame(){

  initAudio();

  /* đọc lựa chọn từ menu */

  if($("lessonSelect")){
    selectedLesson =
      $("lessonSelect").value;
  }

  if($("modeSelect")){
    currentMode =
      $("modeSelect").value;
  }

  if($("countSelect")){
    selectedCount =
      $("countSelect").value;
  }

  if($("difficultySelect")){
    currentDifficulty =
      $("difficultySelect").value;
  }


  saveSettings();


  /* tạo bộ câu hỏi */

  if(!createQuestionPool()){
    return;
  }


  /* reset trạng thái */

  currentIndex = 0;
  score = 0;
  streak = 0;
  bestStreak = 0;
  wrongWords = [];
  answered = false;


  /* chuyển màn hình */

  showScreen("gameScreen");


  /* nhạc */

  if(
    musicOn &&
    !muted
  ){
    startMusic();
  }


  /* câu đầu tiên */

  renderQuestion();
}


/* =========================
   KẾT THÚC GAME
   ========================= */

function finishGame(){

  answered = true;

  stopMusic();

  initAudio();

  finishSound();

  startCelebrationMusic();


  const total =
    questions.length;

  const percent =
    total > 0
      ? Math.round(
          (score / total) * 100
        )
      : 0;


  const isNewBest =
    saveBestScore(score);


  showScreen("finishScreen");


  /* ---------- điểm ---------- */

  if($("finalScore")){
    $("finalScore").textContent =
      score;
  }


  if($("finalTotal")){
    $("finalTotal").textContent =
      total;
  }


  if($("finalPercent")){
    $("finalPercent").textContent =
      percent + "%";
  }


  if($("finalStreak")){
    $("finalStreak").textContent =
      bestStreak;
  }


  if($("bestScore")){
    $("bestScore").textContent =
      getBestScore();
  }


  /* ---------- lời chúc ---------- */

  if($("finishMessage")){

    let message;

    if(percent === 100){
      message =
        "👑 Xuất sắc! Bắc Chi quá đỉnh!";
    }

    else if(percent >= 80){
      message =
        "🌟 Rất tốt! Tiếp tục phát huy nhé!";
    }

    else if(percent >= 60){
      message =
        "💪 Khá tốt! Ôn thêm một chút nữa!";
    }

    else{
      message =
        "🌱 Không sao! Chơi lại là nhớ ngay!";
    }

    if(isNewBest){
      message +=
        "<br>🏆 Kỷ lục mới!";
    }

    $("finishMessage").innerHTML =
      message;
  }


  /* ---------- từ sai ---------- */

  renderWrongWords();

  createConfetti();
}

function renderWrongWords(){

  const box =
    $("wrongReview");

  if(!box){
    return;
  }

  box.innerHTML = "";


  if(wrongWords.length === 0){

    box.innerHTML =
      `<div class="perfect">

  }


  const title =
    document.createElement("h3");

  title.textContent =

  box.appendChild(title);


  wrongWords.forEach(word => {

    const item =
      document.createElement("div");

    item.className =
      "wrong-word";


    item.innerHTML = `
      <div class="wrong-zh">
        ${word.zh}
      </div>

      <div class="wrong-info">
        <strong>${word.py}</strong>
        <span>${word.vi}</span>
      </div>
    `;


    box.appendChild(item);
  });
}

function createConfetti(){

  const container =
    $("confetti");

  if(!container){
    return;
  }

  container.innerHTML = "";


  for(let i = 0; i < 70; i++){

    const piece =
      document.createElement("span");

    piece.className =
      "confetti-piece";


    piece.textContent =
      [
        "🎉",
        "✨",
        "⭐",
        "🌸",
        "🎊",
        "💮"
      ][
        Math.floor(
          Math.random() * 6
        )
      ];


    piece.style.left =
      Math.random() * 100 + "%";

    piece.style.animationDelay =
      Math.random() * 1.5 + "s";

    piece.style.animationDuration =
      (2 + Math.random() * 2) + "s";


    container.appendChild(piece);
  }


  setTimeout(() => {

    container.innerHTML = "";

  }, 5000);
}

/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

  if($("progressText")){
    $("progressText").textContent =
      `${current} / ${total}`;
  }

  if($("progressBar")){
    const percent =
      total > 0
        ? (current / total) * 100
        : 0;

    $("progressBar").style.width =
      percent + "%";
  }
}


/* =========================
   CHỌN LOẠI CÂU HỎI
   ========================= */

function getQuestionType(){

  if(currentMode === "zhvi"){
    return "zhvi";
  }

  if(currentMode === "vizh"){
    return "vizh";
  }

  if(currentMode === "zhpy"){
    return "zhpy";
  }

  /* mixed */

  const types = [
    "zhvi",
    "vizh",
    "zhpy"
  ];

  return types[
    Math.floor(
      Math.random() * types.length
    )
  ];
}


/* =========================
   TẠO CÂU HỎI
   ========================= */

function buildQuestion(word){

  const type =
    getQuestionType();

  let question = "";
  let correct = "";
  let field = "vi";

  if(type === "zhvi"){

    question =
      `<div class="q-label">
        Dịch từ này sang tiếng Việt
       </div>
       <div class="q-main zh">
        ${word.zh}
       </div>
       <div class="q-sub">
        ${word.py}
       </div>`;

    correct = word.vi;
    field = "vi";
  }


  else if(type === "vizh"){

    question =
      `<div class="q-label">
        Chọn chữ Hán phồn thể
       </div>
       <div class="q-main">
        ${word.vi}
       </div>
       <div class="q-sub">
        Tiếng Trung
       </div>`;

    correct = word.zh;
    field = "zh";
  }


  else if(type === "zhpy"){

    question =
      `<div class="q-label">
        Chọn Pinyin đúng
       </div>
       <div class="q-main zh">
        ${word.zh}
       </div>
       <div class="q-sub">
        Chọn cách đọc
       </div>`;

    correct = word.py;
    field = "py";
  }


  return {
    type,
    question,
    correct,
    field
  };
}


/* =========================
   HIỂN THỊ CÂU HIỆN TẠI
   ========================= */

function renderQuestion(){

  if(
    !questions.length ||
    currentIndex >= questions.length
  ){
    finishGame();
    return;
  }

  answered = false;

  const word =
    questions[currentIndex];

  const data =
    buildQuestion(word);

  updateProgress();
  updateStats();


  /* ---------- câu hỏi ---------- */

  if($("question")){
    $("question").innerHTML =
      data.question;
  }


  /* ---------- phản hồi ---------- */

  if($("feedback")){
    $("feedback").textContent = "";
    $("feedback").className =
      "feedback";
  }


  /* ---------- đáp án ---------- */

  const answers =
    $("answers");

  if(!answers){
    return;
  }

  answers.innerHTML = "";


  let options = [
    data.correct,
    ...getDistractors(
      word,
      data.field,
      3
    )
  ];

  options =
    shuffle(options);


  options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.className =
      "answer-btn";

    button.type = "button";

    button.dataset.value =
      option;

    button.innerHTML =
      `<span class="answer-letter">
        ${String.fromCharCode(65 + index)}
       </span>
       <span class="answer-text">
        ${option}
       </span>`;


    button.addEventListener(
      "click",
      () => answerQuestion(
        option,
        data.correct,
        word,
        button
      )
    );


    answers.appendChild(button);
  });
}


/* =========================
   TRẢ LỜI
   ========================= */

function answerQuestion(
  selected,
  correct,
  word,
  clickedButton
){

  if(answered){
    return;
  }


  /* ---------- SAI ---------- */

  if(selected !== correct){

    wrongSound();

    streak = 0;

    if(
      !wrongWords.some(
        item => item.n === word.n
      )
    ){
      wrongWords.push(word);
    }


    if(clickedButton){
      clickedButton.classList.add(
        "wrong"
      );
    }


    if($("feedback")){

      $("feedback").textContent =
        "❌ Chưa đúng, thử lại nhé!";

      $("feedback").className =
        "feedback wrong-text";
    }


    updateStats();

    return;
  }


  /* ---------- ĐÚNG ---------- */

  answered = true;

  correctSound();

  score++;

  streak++;

  if(streak > bestStreak){
    bestStreak = streak;
  }


  if(clickedButton){
    clickedButton.classList.add(
      "correct"
    );
  }


  /* Khoá tất cả nút */

  document
    .querySelectorAll(".answer-btn")
    .forEach(btn => {
      btn.disabled = true;

      if(
        btn.dataset.value === correct
      ){
        btn.classList.add(
          "correct"
        );
      }
    });


  if($("feedback")){

    $("feedback").textContent =
      "🎉 Chính xác!";

    $("feedback").className =
      "feedback correct-text";
  }


  updateStats();


  /* ---------- câu cuối ---------- */

  if(
    currentIndex >=
    questions.length - 1
  ){

    setTimeout(() => {
      finishGame();
    }, 550);

    return;
  }


  /* ---------- tự chuyển câu ---------- */

  setTimeout(() => {

    currentIndex++;

    renderQuestion();

  }, 550);
}


/* =========================
   BẮT ĐẦU GAME
   ========================= */

function startGame(){

  initAudio();

  /* đọc lựa chọn từ menu */

  if($("lessonSelect")){
    selectedLesson =
      $("lessonSelect").value;
  }

  if($("modeSelect")){
    currentMode =
      $("modeSelect").value;
  }

  if($("countSelect")){
    selectedCount =
      $("countSelect").value;
  }

  if($("difficultySelect")){
    currentDifficulty =
      $("difficultySelect").value;
  }


  saveSettings();


  /* tạo bộ câu hỏi */

  if(!createQuestionPool()){
    return;
  }


  /* reset trạng thái */

  currentIndex = 0;
  score = 0;
  streak = 0;
  bestStreak = 0;
  wrongWords = [];
  answered = false;


  /* chuyển màn hình */

  showScreen("gameScreen");


  /* nhạc */

  if(
    musicOn &&
    !muted
  ){
    startMusic();
  }


  /* câu đầu tiên */

  renderQuestion();
}


/* =========================
   KẾT THÚC GAME
   ========================= */

function finishGame(){

  answered = true;

  stopMusic();

  initAudio();

  finishSound();

  startCelebrationMusic();


  const total =
    questions.length;

  const percent =
    total > 0
      ? Math.round(
          (score / total) * 100
        )
      : 0;


  const isNewBest =
    saveBestScore(score);


  showScreen("finishScreen");


  /* ---------- điểm ---------- */

  if($("finalScore")){
    $("finalScore").textContent =
      score;
  }


  if($("finalTotal")){
    $("finalTotal").textContent =
      total;
  }


  if($("finalPercent")){
    $("finalPercent").textContent =
      percent + "%";
  }


  if($("finalStreak")){
    $("finalStreak").textContent =
      bestStreak;
  }


  if($("bestScore")){
    $("bestScore").textContent =
      getBestScore();
  }


  /* ---------- lời chúc ---------- */

  if($("finishMessage")){

    let message;

    if(percent === 100){
      message =
        "👑 Xuất sắc! Bắc Chi quá đỉnh!";
    }

    else if(percent >= 80){
      message =
        "🌟 Rất tốt! Tiếp tục phát huy nhé!";
    }

    else if(percent >= 60){
      message =
        "💪 Khá tốt! Ôn thêm một chút nữa!";
    }

    else{
      message =
        "🌱 Không sao! Chơi lại là nhớ ngay!";
    }

    if(isNewBest){
      message +=
        "<br>🏆 Kỷ lục mới!";
    }

    $("finishMessage").innerHTML =
      message;
  }


  /* ---------- từ sai ---------- */

  renderWrongWords();

  createConfetti();
}


/* =========================
   HIỂN THỊ TỪ SAI
   ========================= */

function renderWrongWords(){

  const box =
    $("wrongReview");

  if(!box){
    return;
  }

  box.innerHTML = "";


  if(wrongWords.length === 0){

    box.innerHTML =
      `<div class="perfect">
        🎉 Không có từ sai! Tuyệt đối!
       </div>`;

    return;
  }


  const title =
    document.createElement("h3");

  title.textContent =
    `📚 Ôn lại ${wrongWords.length} từ sai`;

  box.appendChild(title);


  wrongWords.forEach(word => {

    const item =
      document.createElement("div");

    item.className =
      "wrong-word";


    item.innerHTML = `
      <div class="wrong-zh">
        ${word.zh}
      </div>

      <div class="wrong-info">
        <strong>${word.py}</strong>
        <span>${word.vi}</span>
      </div>
    `;


    box.appendChild(item);
  });
}


/* =========================
   CHƠI LẠI
   ========================= */

function replayGame(){

  stopCelebrationMusic();

  startGame();
}


/* =========================
   ÔN TỪ SAI
   ========================= */

function reviewWrongWords(){

  if(!wrongWords.length){
    return;
  }


  stopCelebrationMusic();

  questions =
    shuffle(wrongWords);

  currentIndex = 0;
  score = 0;
  streak = 0;
  bestStreak = 0;

  showScreen("gameScreen");

  initAudio();

  if(
    musicOn &&
    !muted
  ){
    startMusic();
  }

  renderQuestion();
}


/* =========================
   CONFETTI
   ========================= */

function createConfetti(){

  const container =
    $("confetti");

  if(!container){
    return;
  }

  container.innerHTML = "";


  for(let i = 0; i < 70; i++){

    const piece =
      document.createElement("span");

    piece.className =
      "confetti-piece";


    piece.textContent =
      [
        "🎉",
        "✨",
        "⭐",
        "🌸",
        "🎊",
        "💮"
      ][
        Math.floor(
          Math.random() * 6
        )
      ];


    piece.style.left =
      Math.random() * 100 + "%";

    piece.style.animationDelay =
      Math.random() * 1.5 + "s";

    piece.style.animationDuration =
      (2 + Math.random() * 2) + "s";


    container.appendChild(piece);
  }


  setTimeout(() => {

    container.innerHTML = "";

  }, 5000);
}


/* =========================
   XÓA CONFETTI
   ========================= */

function clearConfetti(){

  if($("confetti")){
    $("confetti").innerHTML = "";
  }
}


/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   PHÍM TẮT TRÊN MÁY TÍNH
   ========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !$("gameScreen") ||
      !$("gameScreen").classList.contains("active")
    ){
      return;
    }


    const key =
      event.key;


    if(
      ["1","2","3","4"]
        .includes(key)
    ){

      const index =
        Number(key) - 1;

      const buttons =
        document.querySelectorAll(
          ".answer-btn"
        );

      if(buttons[index]){
        buttons[index].click();
      }
    }

  }
);
