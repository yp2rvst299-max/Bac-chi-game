<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>500 Từ vựng Hoa ngữ phồn thể</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#18202a;--muted:#667085;--accent:#6c5ce7;--ok:#16834b;--bad:#d92d20;--line:#e4e7ec}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;padding:18px 14px 40px} header{text-align:center;padding:8px 0 14px}
h1{margin:0 0 5px;font-size:27px} .sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 5px 20px #00000008}
.row{display:flex;gap:8px;flex-wrap:wrap} button,select,input{font:inherit}
button{border:0;border-radius:12px;padding:12px 15px;cursor:pointer;background:#eee;color:#18202a}
button.primary{background:var(--accent);color:white} button.small{padding:8px 11px;font-size:13px}
button:disabled{opacity:.55;cursor:not-allowed}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
select,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .mode{text-align:left;min-height:75px}
.mode b{display:block;margin-bottom:5px} .mode span{font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0} .bar{height:100%;background:var(--accent);width:0}
.q{font-size:34px;font-weight:750;text-align:center;padding:22px 5px 15px;line-height:1.35}
.py{text-align:center;color:var(--muted);font-size:16px;min-height:24px}
.answers{display:grid;gap:10px;margin-top:14px} .answer{background:#fff;border:1px solid var(--line);text-align:left;font-size:16px}
.answer.correct{border-color:var(--ok);background:#ecfdf3} .answer.wrong{border-color:var(--bad);background:#fef3f2}
.feedback{min-height:25px;margin-top:12px;text-align:center;font-weight:650}
.hidden{display:none!important} .result{text-align:center} .score{font-size:52px;font-weight:800}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px} .stat div{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px} .muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}
details{margin-top:10px} summary{cursor:pointer;font-weight:650}
@media(max-width:520px){.grid{grid-template-columns:1fr} h1{font-size:23px} .q{font-size:30px}}
</style>
</head>
<body><div class="app">
<header><h1>🀄 500 Từ vựng Hoa ngữ phồn thể</h1><div class="sub">Dịch • Phồn thể • Pinyin • Đặt câu</div></header>

<section id="setup" class="card">
  <div class="grid">
    <div><label>Kiểu kiểm tra</label>
      <select id="mode">
        <option value="vi">Phồn thể → dịch tiếng Việt</option>
        <option value="zh">Tiếng Việt → chọn chữ phồn thể</option>
        <option value="py">Phồn thể → chọn Pinyin</option>
        <option value="write">Đặt câu với từ vựng</option>
      </select>
    </div>
    <div><label>Số câu</label>
      <select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select>
    </div>
    <div><label>Phạm vi</label>
      <select id="range"><option value="all">Tất cả 500 từ</option><option value="first100">100 từ đầu</option><option value="random">Chọn ngẫu nhiên</option></select>
    </div>
    <div><label>Thời gian mỗi câu</label>
      <select id="timer"><option value="0">Không giới hạn</option><option value="30">30 giây</option><option value="20">20 giây</option><option value="10">10 giây</option></select>
    </div>
  </div>
  <button class="primary" style="width:100%;margin-top:14px" onclick="startGame()">Bắt đầu kiểm tra</button>
</section>

<section id="game" class="card hidden">
  <div class="top"><span id="counter"></span><span id="timerText"></span><span id="scoreText"></span></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="question" class="q"></div><div id="py" class="py"></div>
  <div id="answers" class="answers"></div>
  <div id="writeBox" class="hidden">
    <label>Hãy viết một câu tiếng Trung có chứa từ trên:</label>
    <input id="sentence" placeholder="Ví dụ: 我喜歡喝茶。">
    <button class="primary" style="width:100%;margin-top:9px" onclick="submitSentence()">Kiểm tra câu</button>
  </div>
  <div id="feedback" class="feedback"></div>
  <button id="next" class="primary hidden" style="width:100%;margin-top:10px" onclick="nextQuestion()">Câu tiếp theo →</button>
</section>

<section id="result" class="card hidden result">
  <div class="muted">Kết quả</div><div class="score" id="finalScore"></div>
  <div id="resultMsg"></div>
  <div class="stat"><div><b id="correctN">0</b><span class="muted">Đúng</span></div><div><b id="wrongN">0</b><span class="muted">Sai</span></div><div><b id="percentN">0%</b><span class="muted">Tỉ lệ</span></div></div>
  <button class="primary" style="width:100%;margin-top:15px" onclick="backSetup()">Làm lại</button>
  <details><summary>Xem các câu sai</summary><div id="mistakes"></div></details>
</section>

<section class="card">
<details><summary>Danh sách 500 từ</summary>
<div style="overflow:auto;margin-top:8px"><table><thead><tr><th>#</th><th>Phồn thể</th><th>Pinyin</th><th>Nghĩa</th></tr></thead><tbody id="vocab"></tbody></table></div>
</details>
</section>
</div>

function startGame(){

}
